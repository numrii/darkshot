[package]
name = "darkshot"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
eframe = "0.37.0"
global-hotkey = "0.10.0"
image = "0.25.10"
raw-window-handle = "0.6"
rfd = "0.18.0"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Graphics_Dwm"] }
winit = "0.30"
xcap = "0.9.10"

# Optimise dependencies even in dev builds: unoptimised egui/wgpu/image make the
# overlay slow to open and sluggish, which hides real performance problems.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
