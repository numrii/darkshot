[package]
name = "darkshot"
version = "0.1.0"
edition = "2024"
description = "Privacy-first screenshot and annotation tool: clipboard or file, never uploaded"

[dependencies]
arboard = "3.7.0"
# Only what Darkshot uses. The default features include "links", which compiles in
# code to open URLs in a browser (the webbrowser crate); a privacy-first tool has no
# business with that. Also off: Linux backends, web screen reader, system font lookup.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu"] }
global-hotkey = "0.10.0"
image = "0.25.10"
raw-window-handle = "0.6"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
toml = "1.2.1"
tray-icon = "0.26.1"
ttf-parser = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
winit = "0.30"
xcap = "0.9.10"

# Optimise dependencies even in dev builds: unoptimised egui/wgpu/image make the
# overlay slow to open and sluggish, which hides real performance problems.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
# Whole-program optimisation in one unit: smaller and a little faster, at the cost of
# a slower release build.
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
